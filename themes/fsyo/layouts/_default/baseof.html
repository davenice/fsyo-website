<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>

  <header class="site-header" style="background-image: url('{{ "images/header-bg.jpg" | relURL }}')">
    <div class="header-overlay">
      <div class="container">
        <div class="header-brand">
          <a href="{{ "/" | relURL }}" title="{{ .Site.Title }}">
            <img src="{{ "images/FSYO_logo_new_site_trans.png" | relURL }}" alt="{{ .Site.Title }}" />
            <span class="header-title">{{ .Site.Title }}</span>
          </a>
        </div>
      </div>
    </div>
    {{ partial "nav.html" . }}
  </header>

  <div class="content">
    <div class="container">
      <div class="row">

        <section class="col-sm-12">
          <div class="content-border">
            <div class="mythemes-page">
              {{ block "main" . }}{{ end }}
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>

  {{ partial "footer.html" . }}

  <script>
    // Simple mobile nav toggle (replaces WP/Bootstrap JS dependency)
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.querySelector('.btn-collapse');
      if (btn) {
        btn.addEventListener('click', function () {
          var target = document.querySelector(btn.getAttribute('data-toggle'));
          if (target) target.classList.toggle('in');
        });
      }
      // Sticky nav on scroll
      var poor = document.querySelector('.mythemes-poor');
      window.addEventListener('scroll', function () {
        document.body.classList.toggle('scroll-nav', window.scrollY > 50);
      });
    });
  </script>

</body>
</html>
