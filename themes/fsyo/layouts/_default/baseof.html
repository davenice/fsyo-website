<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>

  <header class="site-header" style="background-image: url('{{ "images/header-bg.jpg" | absURL }}')">
    <div class="header-overlay">
      <div class="container">
        <div class="header-brand">
          <a href="{{ "/" | relURL }}" title="{{ .Site.Title }}">
            <img src="{{ "images/FSYO_logo_new_site_trans.png" | relURL }}" alt="{{ .Site.Title }}" />
            <span class="header-title">{{ .Site.Title }}</span>
          </a>
        </div>
      </div>
    </div>
    {{ partial "nav.html" . }}
  </header>

  <div class="content">
    <div class="container">
      <div class="row">

        <section class="col-sm-12">
          <div class="content-border">
            <div class="mythemes-page">
              {{ block "main" . }}{{ end }}
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>

  {{ partial "footer.html" . }}

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Mobile nav toggle
      var btn = document.querySelector('.btn-collapse');
      if (btn) {
        btn.addEventListener('click', function () {
          var target = document.querySelector(btn.getAttribute('data-toggle'));
          if (target) target.classList.toggle('in');
        });
      }

      // Sticky nav — switches to fixed and inserts a spacer to prevent layout jump
      var nav = document.querySelector('.mythemes-poor');
      var spacer = null;

      function update() {
        var navTop = nav.getBoundingClientRect().top;
        if (!nav.classList.contains('is-fixed') && navTop <= 0) {
          var h = nav.offsetHeight;
          nav.classList.add('is-fixed');
          spacer = document.createElement('div');
          spacer.style.height = h + 'px';
          nav.parentNode.insertBefore(spacer, nav);
        } else if (nav.classList.contains('is-fixed') && window.scrollY <= nav._offsetTop) {
          nav.classList.remove('is-fixed');
          if (spacer) { spacer.remove(); spacer = null; }
        }
      }

      // Store natural offset once on load
      nav._offsetTop = nav.getBoundingClientRect().top + window.scrollY;
      window.addEventListener('scroll', update, { passive: true });
    });
  </script>

</body>
</html>
